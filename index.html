<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b7a3d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IRRIC5">
  <title>IRRIC5</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button id="btnBack" class="icon-btn" hidden data-i18n-aria="back" aria-label="Back">‹</button>
  <h1 id="title">IRRIC5</h1>
  <button id="btnLang" class="chip" type="button">EN</button>
  <button id="btnSettings" class="icon-btn" type="button" data-i18n-aria="settings" aria-label="Settings">⚙</button>
</header>

<div class="statusbar" id="statusbar">
  <span class="dot" id="netDot"></span>
  <span id="netText"></span>
  <span class="sep">•</span>
  <span id="pendText"></span>
  <button id="btnSync" class="link-btn" type="button" hidden data-i18n="syncNow"></button>
</div>

<main>

  <!-- ===================== HOME ===================== -->
  <section id="view-home">
    <p class="sub" data-i18n="appSub"></p>
    <div id="setupWarn" class="note warn" hidden data-i18n="needSetup"></div>

    <button class="bigbtn" id="goUpdate" type="button">
      <span class="bigicon">📝</span>
      <span class="bigtxt"><b data-i18n="homeUpdate"></b><small data-i18n="homeUpdateSub"></small></span>
    </button>
    <button class="bigbtn alt" id="goView" type="button">
      <span class="bigicon">📊</span>
      <span class="bigtxt"><b data-i18n="homeView"></b><small data-i18n="homeViewSub"></small></span>
    </button>

    <button id="btnInstall" class="btn ghost" type="button" hidden data-i18n="install"></button>
    <p class="ver"><span data-i18n="version"></span> <span id="verText"></span></p>
  </section>

  <!-- ===================== UPDATE ===================== -->
  <section id="view-update" hidden>
    <form id="form" autocomplete="off" novalidate>
      <div class="card">
        <label class="fld">
          <span class="lbl" data-i18n="date"></span>
          <input type="date" id="fDate" enterkeyhint="next">
        </label>

        <div class="row2">
          <label class="fld">
            <span class="lbl" data-i18n="rap"></span>
            <select id="fRap"></select>
          </label>
          <label class="fld">
            <span class="lbl" data-i18n="label"></span>
            <input type="text" id="fLabel" inputmode="numeric" pattern="[0-9]*" maxlength="8" data-i18n-ph="labelPh" enterkeyhint="next">
          </label>
        </div>

        <div class="row2">
          <div class="fld">
            <span class="lbl" data-i18n="varName"></span>
            <div class="readout" id="fName"></div>
          </div>
          <div class="fld">
            <span class="lbl" data-i18n="noThisYear"></span>
            <div class="readout big" id="fNo">—</div>
          </div>
        </div>

        <div id="ambig" class="note info" hidden></div>
        <div id="hasData" class="note warn" hidden data-i18n="hasData"></div>
      </div>

      <div class="card" id="fields">
        <div class="fld">
          <span class="lbl" data-i18n="f_seed"></span>
          <input type="text" class="num" id="in_seed" inputmode="decimal" enterkeyhint="next">
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_h"></span>
          <small class="muted" data-i18n="f_plant"></small>
          <div class="grid5" id="gridH"></div>
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_t"></span>
          <small class="muted" data-i18n="f_plant"></small>
          <div class="grid5" id="gridT"></div>
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_hills"></span>
          <input type="text" class="num" id="in_hills" inputmode="decimal" enterkeyhint="next">
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_yield"></span>
          <input type="text" class="num" id="in_yield" inputmode="decimal" enterkeyhint="next">
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_pheno"></span>
          <div class="pheno" id="phenoBox"></div>
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_damage"></span>
          <input type="text" class="num" id="in_damage" inputmode="decimal" enterkeyhint="next">
        </div>

        <div class="fld">
          <span class="lbl" data-i18n="f_spe"></span>
          <textarea id="in_spe" rows="3" data-i18n-ph="f_spePh"></textarea>
        </div>
      </div>

      <div id="formErr" class="note err" hidden></div>

      <div class="actionbar">
        <button type="submit" class="btn primary" id="btnSave" data-i18n="save"></button>
      </div>
    </form>
  </section>

  <!-- ===================== VIEW DATA ===================== -->
  <section id="view-data" hidden>
    <div class="card filters">
      <div class="row2">
        <label class="fld">
          <span class="lbl" data-i18n="rap"></span>
          <select id="vRap"></select>
        </label>
        <label class="fld">
          <span class="lbl" data-i18n="searchLabel"></span>
          <input type="text" id="vLabel" inputmode="numeric" maxlength="8">
        </label>
      </div>
      <div class="row2">
        <label class="fld">
          <select id="vStatus">
            <option value="all" data-i18n="stAll"></option>
            <option value="filled" data-i18n="stFilled"></option>
            <option value="empty" data-i18n="stEmpty"></option>
          </select>
        </label>
        <button type="button" class="btn ghost" id="btnReload" data-i18n="refreshData"></button>
      </div>
      <div class="muted small" id="vInfo"></div>
    </div>
    <div id="dataOut"></div>
  </section>

</main>

<div class="toast" id="toast" hidden></div>

<!-- ===================== DIALOG: saved ===================== -->
<dialog id="dlgSaved">
  <div class="dlg">
    <div class="okmark" id="savedMark">✓</div>
    <h2 data-i18n="savedTitle"></h2>
    <p id="savedMsg"></p>
    <p class="muted small" id="savedErr"></p>
    <p class="ask" data-i18n="askNext"></p>
    <button class="btn primary" id="btnContinue" type="button" data-i18n="continueUp"></button>
    <button class="btn ghost" id="btnHome" type="button" data-i18n="toHome"></button>
  </div>
</dialog>

<!-- ===================== DIALOG: settings ===================== -->
<dialog id="dlgSettings">
  <div class="dlg left">
    <h2 data-i18n="settings"></h2>
    <label class="fld">
      <span class="lbl" data-i18n="setUrl"></span>
      <input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" spellcheck="false">
    </label>
    <label class="fld">
      <span class="lbl" data-i18n="setKey"></span>
      <input type="password" id="sKey" autocomplete="off">
    </label>
    <div id="sMsg" class="note info" hidden></div>
    <button class="btn ghost" id="btnTest" type="button" data-i18n="setTest"></button>
    <button class="btn primary" id="btnSetSave" type="button" data-i18n="setSave"></button>
    <button class="btn ghost" id="btnSetClose" type="button" data-i18n="close"></button>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
